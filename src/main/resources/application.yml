spring:
  application:
    name: n8n-kafka-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

github:
  webhook:
    # 비어 있으면 기동 실패 (GithubWebhookProperties @NotBlank)
    secret: ${GITHUB_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
