# 로컬과 OCI에서 같은 파일을 사용한다. 환경별 차이는 .env로 조정한다(.env.example 참고).
name: n8n-kafka

services:
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      # KRaft single broker: 한 노드가 broker와 controller를 겸한다.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 볼륨에 저장된 데이터와 맞아야 하므로 고정한다.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # INTERNAL: compose 네트워크 안(app, kafka-init)용
      # EXTERNAL: 호스트/사설망(로컬 테스트, 집 n8n)용
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 오타난 topic 이름으로 produce/consume해도 topic이 새로 생기지 않게 한다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      # 기본은 localhost에서만 접근 가능. OCI에서는 사설망(Tailscale) IP로 바꾼다.
      - "${KAFKA_EXTERNAL_BIND:-127.0.0.1}:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    # retention 7일: n8n(집 서버)이 꺼져 있어도 이 기간 안에 켜지면 밀린 이벤트를 처리할 수 있다.
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists
        --topic github.pr.events
        --partitions 3
        --replication-factor 1
        --config retention.ms=604800000
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic github.pr.events

  app:
    image: ghcr.io/owencity/n8n_kafka_api:${APP_TAG:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # 비어 있으면 app이 기동되지 않는다 (.env에 설정)
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:8080:8080"

volumes:
  kafka-data:
